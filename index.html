</head><body><noscript><h1>Vatsal Verma</h1><p>Software engineer at Amdocs. Java, Spring Boot, Kafka, Elasticsearch, and JVM systems. Biker and photographer.</p><nav><a href="/">Home</a> · <a href="/about">About</a> · <a href="/work">Work &amp; Life</a> · <a href="/blog">Blog</a> · <a href="/contact">Contact</a></nav><h2>Writing</h2><ul><li><a href="/blog/interesting-finds">My “I’ll Come Back to This” Collection</a> - Papers, articles, and anything else worth saving, a living list of things I keep coming back to.</li><li><a href="/blog/spring-boot-ultra-zero-to-architect">Spring Boot Ultra: Main Character Energy for Your Backend</a> - The ultra Spring Boot textbook - Parts I–XXI with deep lessons, matrices, mermaid diagrams, labs, architect chapters (starters, Actuator, security, GraphQL, SSL, JdbcClient, CRaC), plus a 972-topic atlas with official docs links.</li><li><a href="/blog/elasticsearch-complete-course">It's Lucene All the Way Down</a> - A proper Elasticsearch course - teach Lucene guts, search, analytics, lifecycle, vectors, and ops with worked examples and official elastic.co docs links on every topic. Not a flashcard deck.</li><li><a href="/blog/java-internals-1000-qa">Know the JVM, My Brother. Offers Follow.</a> - A thousand Q&amp;As on JVM guts - memory, GC, concurrency, proxies, classloading - and the basics that still break production. Built for revision, not fluff.</li><li><a href="/blog/introducing-arwenforge">ArwenForge: Profile-Based RBAC for Multi-Agent MCP Servers</a> - One MCP endpoint, many agents. ArwenForge tags tools, resources, prompts, and delegates with profiles — then enforces least-privilege discovery and fail-closed execution on the JVM.</li><li><a href="/blog/introducing-docube-db">docube-db: Zero-Infra Code Lookup via Prefix Pruning</a> - A small Java library that finds the right invoice, serial, or part code when the input is almost right using a chunk trie to prune and Levenshtein to rank. Open source on GitHub.</li><li><a href="/blog/dp-basic-to-advanced">State It. Cache It. Ace It. A Dynamic Programming Guide.</a> - A 7-day roadmap from recursion and memoization through knapsack, tree DP, bitmask DP, and interval DP - with curated LeetCode problems and contest-ready patterns.</li><li><a href="/blog/langchain-langgraph-blog">Everything you need to know about LangChain and LangGraph</a> - This post takes you from &quot;what is an LLM API?&quot; to production agents - step by step, no prior knowledge assumed.</li><li><a href="/blog/solid-principles-ultimate-guide">One Change Breaks Everything? Five SOLID Principles Fix That</a> - A deep-dive into all five SOLID principles with real-world analogies, bad vs. good code comparisons, and complete Java examples. Learn how to write clean, maintainable, and extensible software that your future self will thank you for.</li><li><a href="/blog/design-patterns-ultimate-guide">Design Patterns Hiding in Your Code - All of Them, Explained</a> - A deep-dive into all 23 GoF design patterns - Creational, Structural, and Behavioral, explained with real-world analogies, UML intent, and complete Java code examples. Your one-stop reference for writing better, scalable software.</li><li><a href="/blog/embabel-agent-framework">Embabel Agent Framework: Build Smarter AI Agents on the JVM</a> - A deep-dive into Embabel - the JVM-native agent framework that replaces brittle workflows with type-driven, goal-oriented AI planning. Learn the core concepts, write your first agent, and understand why it's a step ahead of LangGraph, CrewAI, and similar tools.</li></ul><p><a href="https://www.vatsalverma.in/rss.xml">RSS feed</a></p></noscript><div id="root"></div></body></html>
